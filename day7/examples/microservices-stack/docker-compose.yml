services:
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./reverse-proxy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - frontend

  frontend:
    build: ./frontend
    ports:
      - "8080:80"

  api:
    build: ./api
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001"]
      interval: 5s
      timeout: 2s
      retries: 5
